# Independent manual publication of the immutable selected source.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: Activate
  MACOS_DEPLOYMENT_TARGET: '11.0'
  BASE_DIR: test
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate source and publication absence before native work
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check clean selected checkout before native work
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"
      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Remove only stale Release x64 generated outputs
        shell: bash
        run: python3 .github/scripts/native.py clean-windows
      - name: build x64
        shell: cmd
        run: |
          msbuild "%PRODUCT_NAME%.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m
      - name: Validate exact Windows output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'test/Plugins/activate.bundle/Contents/Windows64/activate.4DX'
          foreach ($part in @('.', 'test', 'test/Plugins', 'test/Plugins/activate.bundle',
                             'test/Plugins/activate.bundle/Contents',
                             'test/Plugins/activate.bundle/Contents/Windows64', $path)) {
            $item = Get-Item -LiteralPath $part -Force -ErrorAction Stop
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Reparse output: $part"
            }
          }
          $file = Get-Item -LiteralPath $path -Force -ErrorAction Stop
          if ($file.PSIsContainer -or $file.Length -le 0) {
            throw 'Missing or empty exact Release x64 output'
          }
      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: test/Plugins/activate.bundle/Contents/Windows64/activate.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check clean selected checkout before native work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"
      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild
      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash .github/scripts/native.sh import-certificate
      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: bash .github/scripts/native.sh store-credentials
      - name: build macOS plugin (universal)
        run: bash .github/scripts/native.sh build
      - name: verify universal binary
        run: bash .github/scripts/native.sh verify
      - name: merge Windows binaries into the bundle
        run: bash .github/scripts/native.sh merge-windows
      - name: codesign
        run: bash .github/scripts/native.sh sign
      - name: package, notarize & staple
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash .github/scripts/native.sh package
      - name: Create new tag, public release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/release.py publish --sha "$GITHUB_SHA" "$PRODUCT_NAME-$VERSION.zip" "$PRODUCT_NAME-$VERSION.dmg"
